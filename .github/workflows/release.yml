name: Beta release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: version
        name: Check release versions
        run: node scripts/release-version.mjs >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npm run build

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
            target: aarch64-apple-darwin
            bundles: app
          - os: windows-2022
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Build release
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri -- build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Collect installers
        run: node scripts/package-release.mjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: folio-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [verify, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: folio-*
          path: release-assets
          merge-multiple: true
      - name: Verify assets and generate checksums
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          cd release-assets
          test -f "Folio_${VERSION}_macos-arm64.zip"
          test -f "Folio_${VERSION}_windows-x64-setup.exe"
          test -f "Folio_${VERSION}_linux-x64.AppImage"
          test -f "Folio_${VERSION}_linux-x64.deb"
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          sha256sum Folio_* > SHA256SUMS.txt
      - name: Publish beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "v${VERSION}" release-assets/* \
            --target "$RELEASE_COMMIT" \
            --title "Folio ${VERSION} Beta" \
            --notes-file "releases/${VERSION}.md" \
            --prerelease --latest=false
